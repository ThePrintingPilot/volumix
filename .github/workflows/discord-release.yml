name: Announce Release on Discord

on:
  workflow_dispatch:
  release:
    types:
      - published

jobs:
  discord:
    runs-on: ubuntu-latest

    steps:
      - name: Send Discord release message
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          RELEASE_NAME: ${{ github.event.release.name || 'Manual test release' }}
          RELEASE_TAG: ${{ github.event.release.tag_name || 'test-version' }}
          RELEASE_URL: ${{ github.event.release.html_url || github.server_url }}
          REPO_NAME: ${{ github.repository }}
        run: |
          jq -n \
            --arg content "🎚️ **Volumix Update Released!**

A new version of **Volumix** is now available.

**Version:** $RELEASE_TAG
**Release:** $RELEASE_NAME

📦 Download it here:
$RELEASE_URL" \
            '{content: $content}' > payload.json

          curl -H "Content-Type: application/json" \
               -d @payload.json \
               "$DISCORD_WEBHOOK_URL"