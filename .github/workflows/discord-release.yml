name: Announce Release on Discord

on:
  workflow_dispatch:
  release:
    types:
      - published
  push:
    tags:
      - "v*"

jobs:
  discord:
    runs-on: ubuntu-latest

    steps:
      - name: Send Discord message
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          curl -H "Content-Type: application/json" \
               -d '{"content":"🎚️ **Volumix Update Released!**\n\nA new version of **Volumix** is now available.\n\n📦 Download it here:\nhttps://github.com/ThePrintingPilot/volumix/releases/latest"}' \
               "$DISCORD_WEBHOOK_URL"